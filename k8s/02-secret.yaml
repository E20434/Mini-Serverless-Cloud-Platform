# A Kubernetes Secret is NOT encryption - it's base64 encoding plus
# different RBAC/tooling treatment than a ConfigMap (kubectl hides
# Secret values by default, etcd CAN be configured for encryption-at-rest
# but isn't by default, and Secrets are excluded from things like `kubectl
# get -o yaml` diffs shown in some UIs). Using `stringData` here (plain
# text in this file) rather than pre-computed base64 is purely for
# manifest readability - Kubernetes does the base64 encoding itself when
# this is applied. These are the SAME trivial local-dev-only credentials
# already in .env/.env.example - never reuse values like these anywhere
# real, and never commit a REAL secret's plaintext to git the way this
# demo file does for convenience.
apiVersion: v1
kind: Secret
metadata:
  name: mini-cloud-secrets
  namespace: mini-cloud
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://mini_cloud:mini_cloud@host.docker.internal:5432/mini_cloud?schema=public'
  JWT_SECRET: 'local-dev-only-secret-do-not-use-in-production'
  S3_ACCESS_KEY_ID: 'mini_cloud'
  S3_SECRET_ACCESS_KEY: 'mini_cloud_secret'
